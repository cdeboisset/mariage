<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mariage</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      border: none;
    }

    /* téléphone */
    @media (max-width: 768px) {
      iframe {
        content: url("mariage.pdf#zoom=200");
      }
    }
  </style>
</head>
<body>
  <iframe id="pdf" src="mariage.pdf#zoom=100"></iframe>
</body>
</html>
